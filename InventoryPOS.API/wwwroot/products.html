<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos — InventoryPOS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="sidebar"></nav>
<div id="main">
  <header id="topbar"></header>
  <main class="content">
    <div class="filters-bar">
      <div class="search-wrap"><i class="bi bi-search"></i><input id="search" type="text" class="form-control" placeholder="Buscar por nombre, SKU o código..."></div>
      <select id="cat-filter" class="form-control"><option value="">Todas las categorías</option></select>
      <select id="stock-filter" class="form-control" style="width:140px">
        <option value="">Todos</option>
        <option value="low">Stock bajo</option>
      </select>
      <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo producto</button>
    </div>
    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nombre</th><th>SKU</th><th>Categoría</th>
              <th>Precio</th><th>Costo</th><th>Stock</th><th>Estado</th><th></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="8" class="empty-state"><div class="spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="modal-title">Nuevo producto</h3>
      <button class="modal-close" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <div class="form-group" style="grid-column:1/-1"><label>Nombre *</label><input id="f-name" class="form-control" placeholder="Nombre del producto"></div>
      </div>
      <div class="form-row-3">
        <div class="form-group"><label>SKU</label><input id="f-sku" class="form-control" placeholder="SKU-001"></div>
        <div class="form-group"><label>Código de barras</label><input id="f-barcode" class="form-control"></div>
        <div class="form-group"><label>Unidad</label>
          <select id="f-unit" class="form-control"><option>pza</option><option>kg</option><option>lt</option><option>m</option><option>caja</option><option>par</option></select>
        </div>
      </div>
      <div class="form-row-3">
        <div class="form-group"><label>Precio de venta *</label><input id="f-price" type="number" min="0" step="0.01" class="form-control" placeholder="0.00"></div>
        <div class="form-group"><label>Costo</label><input id="f-cost" type="number" min="0" step="0.01" class="form-control" placeholder="0.00"></div>
        <div class="form-group"><label>Stock inicial</label><input id="f-stock" type="number" min="0" step="0.001" class="form-control" placeholder="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Stock mínimo</label><input id="f-minstock" type="number" min="0" step="0.001" class="form-control" placeholder="5"></div>
        <div class="form-group"><label>Categoría</label><select id="f-cat" class="form-control"><option value="">Sin categoría</option></select></div>
      </div>
      <div class="form-group"><label>Descripción</label><textarea id="f-desc" class="form-control" rows="2" placeholder="Descripción opcional"></textarea></div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="f-active" checked> Producto activo
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProduct()"><i class="bi bi-check-lg"></i> Guardar</button>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/products.js"></script>
</body>
</html>
