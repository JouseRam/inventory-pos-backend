<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías — InventoryPOS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="sidebar"></nav>
<div id="main">
  <header id="topbar"></header>
  <main class="content">
    <div class="filters-bar">
      <div class="search-wrap"><i class="bi bi-search"></i><input id="search" type="text" class="form-control" placeholder="Buscar categoría..."></div>
      <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nueva categoría</button>
    </div>
    <div class="card">
      <div class="table-responsive">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th><th>Productos</th><th>Estado</th><th></th></tr></thead>
          <tbody id="table-body"><tr><td colspan="5" class="empty-state"><div class="spinner"></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Nueva categoría</h3>
      <button class="modal-close" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <div class="form-group"><label>Nombre *</label><input id="f-name" class="form-control" placeholder="Nombre de la categoría"></div>
      <div class="form-group"><label>Descripción</label><textarea id="f-desc" class="form-control" rows="3" placeholder="Descripción opcional"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="save()"><i class="bi bi-check-lg"></i> Guardar</button>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
