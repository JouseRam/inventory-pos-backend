<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de Venta — InventoryPOS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="sidebar"></nav>
<div id="main">
  <header id="topbar"></header>
  <main class="content" style="padding:16px">
    <div class="pos-layout">
      <!-- LEFT: product search + grid -->
      <div class="pos-left">
        <div class="pos-search">
          <div style="position:relative;flex:1">
            <i class="bi bi-search" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
            <input id="prod-search" type="text" class="form-control" placeholder="Buscar producto o escanear código..." style="padding-left:34px" autofocus>
          </div>
          <select id="cat-filter" class="form-control" style="width:160px">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="products-grid" id="products-grid">
          <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT: cart -->
      <div class="pos-right">
        <div class="cart-panel">
          <div class="cart-header">
            <span><i class="bi bi-cart3" style="color:var(--primary)"></i> Carrito</span>
            <button class="btn btn-secondary btn-sm" onclick="clearCart()"><i class="bi bi-trash"></i></button>
          </div>

          <div class="cart-items" id="cart-items">
            <div class="empty-state"><i class="bi bi-cart"></i><p>Carrito vacío</p></div>
          </div>

          <div class="cart-totals">
            <div class="total-row"><span>Subtotal</span><span id="t-sub">$0.00</span></div>
            <div class="total-row">
              <span>Descuento</span>
              <span><input id="t-discount" type="number" min="0" step="0.01" value="0" style="width:80px;text-align:right;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:.85rem" oninput="calcTotals()"></span>
            </div>
            <div class="total-row">
              <span>IVA (16%)</span>
              <label style="font-size:.8rem;cursor:pointer">
                <input type="checkbox" id="apply-tax" onchange="calcTotals()"> Aplicar
              </label>
            </div>
            <div class="total-row"><span>IVA</span><span id="t-tax">$0.00</span></div>
            <div class="total-row grand"><span>TOTAL</span><span id="t-total">$0.00</span></div>
          </div>

          <div class="cart-pay">
            <div style="margin-bottom:8px">
              <label style="font-size:.8rem;font-weight:500;margin-bottom:4px;display:block">Método de pago</label>
              <div class="payment-grid">
                <div class="pay-method active" data-method="Efectivo" onclick="selectMethod(this)"><i class="bi bi-cash"></i> Efectivo</div>
                <div class="pay-method" data-method="Tarjeta" onclick="selectMethod(this)"><i class="bi bi-credit-card"></i> Tarjeta</div>
                <div class="pay-method" data-method="Transferencia" onclick="selectMethod(this)"><i class="bi bi-phone"></i> Transferencia</div>
                <div class="pay-method" data-method="Otro" onclick="selectMethod(this)"><i class="bi bi-three-dots"></i> Otro</div>
              </div>
            </div>
            <div class="form-row" style="margin-bottom:8px">
              <div>
                <label style="font-size:.8rem;font-weight:500;margin-bottom:4px;display:block">Recibido</label>
                <input id="amount-paid" type="number" min="0" step="0.01" class="form-control" value="" placeholder="0.00" oninput="calcChange()">
              </div>
              <div>
                <label style="font-size:.8rem;font-weight:500;margin-bottom:4px;display:block">Cambio</label>
                <div id="change-display" style="padding:9px 12px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;font-size:.875rem;font-weight:700;color:var(--success)">$0.00</div>
              </div>
            </div>
            <div style="margin-bottom:8px">
              <label style="font-size:.8rem;font-weight:500;margin-bottom:4px;display:block">Cliente <small style="color:var(--text-muted)">(opcional)</small></label>
              <select id="customer-sel" class="form-control">
                <option value="">— Mostrador —</option>
              </select>
            </div>
            <button class="btn btn-success" style="width:100%;font-size:1rem;padding:12px" onclick="processSale()">
              <i class="bi bi-check-circle"></i> Registrar venta
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Receipt modal -->
<div class="modal-overlay" id="receipt-modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3><i class="bi bi-check-circle-fill" style="color:var(--success)"></i> Venta registrada</h3>
      <button class="modal-close" onclick="closeReceipt()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body" id="receipt-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeReceipt()">Cerrar</button>
      <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pos.js"></script>
</body>
</html>
