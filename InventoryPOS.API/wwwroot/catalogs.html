<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorías y marcas · Matiz</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page" id="page">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="categories">Categorías</button>
      <button role="tab" aria-selected="false" data-tab="brands">Marcas</button>
    </div>
    <div data-panel="categories" id="categories"></div>
    <div data-panel="brands" id="brands" hidden></div>
  </main>
  <script src="js/core.js"></script>
  <script src="js/crud.js"></script>
  <script>
    POS.boot({ module: 'Products', title: 'Categorías y marcas' }, async () => {
      const { esc, session, api, $, $$ } = POS;
      const canEdit = session.can('Products', true);
      const parents = (await api.get('/categories')).filter(c => !c.parentId);
      const cats = crud({
        mount: $('#categories'), endpoint: '/categories', noun: 'categoría', canEdit,
        emptyText: 'Aún no hay categorías.',
        columns: [
          { label: 'Categoría', cell: r => r.parentName ? `<span class="muted">${esc(r.parentName)} ›</span> <b>${esc(r.name)}</b>` : `<b>${esc(r.name)}</b>` },
          { label: 'Descripción', cell: r => `<span class="muted">${esc(r.description || '')}</span>` },
        ],
        fields: `
          <label class="field"><span>Nombre</span><input name="name" required maxlength="100"></label>
          <label class="field"><span>Dentro de</span><select name="parentId" data-type="nullable-number"><option value="">(Categoría principal)</option>
            ${parents.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
          <label class="field span-all"><span>Descripción</span><input name="description" maxlength="500"></label>`,
        deleteText: r => `Quitar la categoría ${r.name}. Si tiene productos solo se desactiva.`,
      });
      const brands = crud({
        mount: $('#brands'), endpoint: '/brands', noun: 'marca', canEdit,
        emptyText: 'Aún no hay marcas. Agrega las que manejas: Igora, Koleston, L'Oréal…',
        columns: [{ label: 'Marca', cell: r => `<b>${esc(r.name)}</b>` }],
        fields: '<label class="field span-all"><span>Nombre</span><input name="name" required maxlength="100"></label>',
        deleteText: r => `Quitar la marca ${r.name}. Si tiene productos solo se desactiva.`,
      });
      function show(tab) {
        $$('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
        $$('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== tab; });
        history.replaceState(null, '', '#' + tab);
        (tab === 'brands' ? brands : cats).load();
      }
      $$('[data-tab]').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
      show(location.hash === '#brands' ? 'brands' : 'categories');
    });
  </script>
</body>
</html>
