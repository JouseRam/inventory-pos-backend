<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matiz POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..750&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login">
    <section class="login-art" aria-hidden="true">
      <div class="ramp" id="ramp"></div>
      <h2>Del 1 al 10, cada tono en su lugar.</h2>
      <p>Ventas, caja e inventario por lote para tu tienda de belleza.</p>
    </section>
    <section class="login-form">
      <form id="login-form" autocomplete="on">
        <div>
          <div class="eyebrow">Matiz POS</div>
          <h1 id="business-name">Inicia sesión</h1>
        </div>
        <label class="field"><span>Usuario</span><input id="userName" name="userName" autocomplete="username" required autofocus></label>
        <label class="field"><span>Contraseña</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <div class="form-error" id="login-error" role="alert" hidden></div>
        <button class="btn primary lg" type="submit" id="login-btn">Entrar</button>
        <p class="muted" style="margin:0;font-size:.85rem">¿Olvidaste tu contraseña? Pide al administrador que la restablezca.</p>
      </form>
    </section>
  </div>
  <script src="js/core.js"></script>
  <script>
    (function () {
      const { api, session, shade, $ } = POS;
      // Level chart with the natural reflect, the reference every colorist knows.
      $('#ramp').innerHTML = Array.from({ length: 10 }, (_, i) => {
        const code = `${i + 1}.0`;
        return `<span style="background:${shade.color(code)}">${code}</span>`;
      }).join('');

      if (session.token) { location.href = session.profile ? POS.firstAllowedPage() : 'dashboard.html'; return; }

      $('#login-form').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = $('#login-btn'), error = $('#login-error');
        btn.disabled = true; error.hidden = true;
        try {
          const auth = await api.post('/auth/login', { userName: $('#userName').value.trim(), password: $('#password').value });
          session.save(auth);
          const next = new URLSearchParams(location.search).get('next');
          location.href = next && /^[\w-]+\.html/.test(next) ? next : POS.firstAllowedPage();
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
          $('#password').select();
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
