<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas · Matiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..750&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .receipt { font-family: var(--font-mono); font-size: .88rem; display: grid; gap: 4px; }
    .receipt .row { display: flex; justify-content: space-between; gap: 12px; }
    .receipt .item { padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .receipt .grand { font: 650 1.4rem var(--font-display); padding-top: 6px; }
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="toolbar">
      <label class="field"><span>Desde</span><input type="date" id="from"></label>
      <label class="field"><span>Hasta</span><input type="date" id="to"></label>
      <label class="field"><span>Forma de pago</span><select id="method"><option value="">Todas</option><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select></label>
      <span class="grow"></span>
      <span class="muted" id="summary"></span>
    </div>
    <section class="panel">
      <div class="table-wrap"><table><thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Pago</th><th class="num">Pzas</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody id="list"></tbody></table></div>
      <div class="body" style="display:flex;gap:8px;justify-content:flex-end;align-items:center"><span class="muted" id="page-info"></span><button class="btn sm" id="prev" type="button">Anterior</button><button class="btn sm" id="next" type="button">Siguiente</button></div>
    </section>

    <dialog id="detail" aria-labelledby="detail-title">
      <form method="dialog">
        <header><h2 id="detail-title">Venta</h2><button class="btn ghost icon-btn" value="cancel" aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></header>
        <div class="body" id="detail-body"></div>
        <footer><button class="btn danger" value="void" id="void-btn" type="button">Cancelar venta</button><button class="btn" value="cancel">Cerrar</button></footer>
      </form>
    </dialog>
  </main>
  <script src="js/core.js"></script>
  <script>
    POS.boot({ module: 'Sales', title: 'Ventas' }, async () => {
      const { api, session, fmt, esc, toast, fail, confirmBox, $ } = POS;
      const canEdit = session.can('Sales', true);
      let page = 1, total = 0, current = null;
      $('#from').value = fmt.isoDay(new Date(Date.now() - 6 * 864e5));
      $('#to').value = fmt.isoDay();

      const status = s => s.status === 'Cancelada'
        ? '<span class="pill crit"><i class="bi bi-x-circle"></i>Cancelada</span>' : '<span class="pill good"><i class="bi bi-check2"></i>Completada</span>';

      async function load() {
        const qs = new URLSearchParams({ page, pageSize: 50 });
        if ($('#from').value) qs.set('from', $('#from').value);
        if ($('#to').value) qs.set('to', $('#to').value);
        if ($('#method').value) qs.set('paymentMethod', $('#method').value);
        const r = await api.get('/sales?' + qs);
        total = r.total;
        $('#page-info').textContent = r.total ? `${(page - 1) * 50 + 1}–${Math.min(page * 50, r.total)} de ${r.total}` : '';
        const done = r.data.filter(s => s.status !== 'Cancelada');
        $('#summary').textContent = r.total ? `${done.length} ventas en esta página · ${fmt.money(done.reduce((a, s) => a + s.total, 0))}` : '';
        $('#list').innerHTML = r.data.length ? r.data.map(s => `
          <tr class="clickable ${s.status === 'Cancelada' ? 'inactive' : ''}" data-id="${s.id}"><td class="mono">${esc(s.folio)}</td><td>${fmt.dateTime(s.createdAt)}</td>
          <td>${esc(s.customerName)}</td><td>${esc(s.paymentMethod)}</td><td class="num">${s.itemCount}</td>
          <td class="num">${fmt.money(s.total)}</td><td>${status(s)}</td></tr>`).join('')
          : '<tr><td colspan="7" class="empty">No hay ventas en estas fechas.</td></tr>';
      }
      ['#from', '#to', '#method'].forEach(id => $(id).addEventListener('change', () => { page = 1; load(); }));
      $('#prev').addEventListener('click', () => { if (page > 1) { page--; load(); } });
      $('#next').addEventListener('click', () => { if (page * 50 < total) { page++; load(); } });

      async function show(id) {
        const s = current = await api.get('/sales/' + id);
        $('#detail-title').innerHTML = `Venta <span class="mono">${esc(s.folio)}</span> ${status(s)}`;
        $('#detail-body').innerHTML = `
          <div class="muted">${fmt.dateTime(s.createdAt)} · ${esc(s.customerName)}</div>
          <div class="receipt">
            ${s.items.map(i => `<div class="item"><div>${esc(i.description)}</div>
              <div class="row muted"><span>${fmt.qty(i.quantity)} × ${fmt.money(i.unitPrice)}${i.discount ? ' − ' + fmt.money(i.discount) : ''}</span><span style="color:var(--ink)">${fmt.money(i.subtotal)}</span></div></div>`).join('')}
            <div class="row"><span>Subtotal</span><span>${fmt.money(s.subtotal)}</span></div>
            ${s.discount ? `<div class="row"><span>Descuento</span><span>− ${fmt.money(s.discount)}</span></div>` : ''}
            <div class="row grand"><span>Total</span><span>${fmt.money(s.total)}</span></div>
            <div class="row muted"><span>IVA incluido</span><span>${fmt.money(s.tax)}</span></div>
            ${s.payments.map(p => `<div class="row"><span>${esc(p.method)}${p.reference ? ' · ' + esc(p.reference) : ''}</span><span>${fmt.money(p.amount)}</span></div>`).join('')}
            <div class="row muted"><span>Recibido / cambio</span><span>${fmt.money(s.amountPaid)} / ${fmt.money(s.change)}</span></div>
          </div>
          ${s.notes ? `<p style="margin:0" class="muted">${esc(s.notes)}</p>` : ''}
          ${s.cancelReason ? `<div class="form-error">Cancelada ${fmt.dateTime(s.cancelledAt)}: ${esc(s.cancelReason)}</div>` : ''}`;
        $('#void-btn').hidden = !canEdit || s.status === 'Cancelada';
        $('#detail').showModal();
      }
      $('#list').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (r) show(r.dataset.id); });

      $('#void-btn').addEventListener('click', async () => {
        const reason = await confirmBox(`Cancelar la venta ${current.folio} por ${fmt.money(current.total)}. Las piezas regresan a su lote original.`,
          { okText: 'Cancelar venta', danger: true, input: 'Motivo de la cancelación' });
        if (!reason) return;
        try {
          await api.post(`/sales/${current.id}/cancel`, { reason });
          toast(`Venta ${current.folio} cancelada.`);
          $('#detail').close();
          await load();
        } catch (err) { fail(err); }
      });

      await load();
      const fromHash = Number(location.hash.slice(1));
      if (fromHash) show(fromHash).catch(POS.fail);
    });
  </script>
</body>
</html>
