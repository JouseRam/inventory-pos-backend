<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes · Matiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..750&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page" id="page"><div id="crud"></div></main>
  <script src="js/core.js"></script>
  <script src="js/crud.js"></script>
  <script>
    POS.boot({ module: 'Customers', title: 'Clientes' }, async () => {
      const { esc, fmt, session } = POS;
      await crud({
        mount: document.getElementById('crud'), endpoint: '/customers', noun: 'cliente', canEdit: session.can('Customers', true),
        search: 'Nombre, teléfono o correo', emptyText: 'Aún no hay clientes. Agrega a las clientas frecuentes para guardar su tono habitual.',
        columns: [
          { label: 'Nombre', cell: r => `<b>${esc(r.name)}</b>` },
          { label: 'Teléfono', cell: r => `<span class="mono">${esc(r.phone || '')}</span>` },
          { label: 'Correo', cell: r => esc(r.email || '') },
          { label: 'Tono habitual y notas', cell: r => `<span class="muted">${esc(r.notes || '')}</span>` },
          { label: 'Alta', cell: r => fmt.date(r.createdAt) },
        ],
        fields: `
          <label class="field span-all"><span>Nombre</span><input name="name" required maxlength="200"></label>
          <label class="field"><span>Teléfono</span><input name="phone" maxlength="30" inputmode="tel"></label>
          <label class="field"><span>Correo</span><input name="email" type="email" maxlength="150"></label>
          <label class="field span-all"><span>Dirección</span><input name="address" maxlength="300"></label>
          <label class="field span-all"><span>Tono habitual, alergias, notas</span><textarea name="notes" rows="3" maxlength="1000" placeholder="Ej. 6.1 con oxidante 20 vol; sensible a amoniaco"></textarea></label>`,
        deleteText: r => `Desactivar a ${r.name}. Su historial de compras se conserva.`,
      }).load();
    });
  </script>
</body>
</html>
