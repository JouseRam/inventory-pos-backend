<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes — InventoryPOS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="sidebar"></nav>
<div id="main">
  <header id="topbar"></header>
  <main class="content">
    <div class="filters-bar">
      <select id="period" class="form-control" style="width:180px" onchange="loadReports()">
        <option value="7">Últimos 7 días</option>
        <option value="30" selected>Últimos 30 días</option>
        <option value="60">Últimos 60 días</option>
        <option value="90">Últimos 90 días</option>
      </select>
    </div>

    <!-- Summary KPIs -->
    <div class="kpi-grid" id="kpi-row">
      <div class="kpi-card"><div class="kpi-icon indigo"><i class="bi bi-receipt"></i></div><div><div class="kpi-value" id="r-count">—</div><div class="kpi-label">Ventas</div></div></div>
      <div class="kpi-card"><div class="kpi-icon green"><i class="bi bi-currency-dollar"></i></div><div><div class="kpi-value" id="r-revenue">—</div><div class="kpi-label">Ingresos</div></div></div>
      <div class="kpi-card"><div class="kpi-icon cyan"><i class="bi bi-calculator"></i></div><div><div class="kpi-value" id="r-avg">—</div><div class="kpi-label">Ticket promedio</div></div></div>
      <div class="kpi-card"><div class="kpi-icon amber"><i class="bi bi-tag"></i></div><div><div class="kpi-value" id="r-disc">—</div><div class="kpi-label">Descuentos</div></div></div>
    </div>

    <div class="chart-grid">
      <div class="card">
        <div class="card-header"><h2><i class="bi bi-bar-chart" style="color:var(--primary)"></i> Ventas por día</h2></div>
        <div class="card-body"><div class="chart-container"><canvas id="chart-days" height="280"></canvas></div></div>
      </div>
      <div class="card">
        <div class="card-header"><h2><i class="bi bi-credit-card" style="color:var(--success)"></i> Métodos de pago</h2></div>
        <div class="card-body"><div class="chart-container"><canvas id="chart-methods" height="280"></canvas></div></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px" id="bottom-grid">
      <div class="card">
        <div class="card-header"><h2><i class="bi bi-trophy" style="color:var(--warning)"></i> Top 10 productos</h2></div>
        <div class="table-responsive">
          <table>
            <thead><tr><th>#</th><th>Producto</th><th>Cantidad</th><th>Ingresos</th></tr></thead>
            <tbody id="top-products-body"><tr><td colspan="4" style="text-align:center;padding:20px"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h2><i class="bi bi-tags" style="color:var(--info)"></i> Ventas por categoría</h2></div>
        <div class="card-body"><div class="chart-container"><canvas id="chart-cats" height="260"></canvas></div></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
