<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2b2a29">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recepciones · Anna’s Beauty Supply</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .rline { display: grid; grid-template-columns: minmax(200px, 2fr) 90px 110px 130px 150px 32px; gap: 8px; align-items: end; }
    @media (max-width: 760px) { .rline { grid-template-columns: 1fr 1fr; } .rline > :first-child { grid-column: 1 / -1; } }
    .r-vs { font-size: .75rem; font-weight: 600; white-space: nowrap; }
    .r-vs.ok { color: var(--good); } .r-vs.short { color: var(--crit); } .r-vs.extra { color: var(--warn); }
    .r-order { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface-2); }
    .r-order-status { font-size: .9rem; }
    .r-order-status.ok { color: var(--good); font-weight: 600; } .r-order-status.short { color: var(--crit); }
    .r-order-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <template id="page-actions">
    <button class="btn primary" id="new-btn" type="button"><i class="bi bi-box-arrow-in-down"></i>Recibir mercancía</button>
  </template>
  <main class="page" id="page">
    <div class="toolbar">
      <label class="field"><span>Desde</span><input type="date" id="from"></label>
      <label class="field"><span>Hasta</span><input type="date" id="to"></label>
      <label class="field"><span>Proveedor</span><select id="f-supplier"><option value="">Todos</option></select></label>
    </div>
    <section class="panel">
      <div class="table-wrap"><table><thead><tr><th>Folio</th><th>Fecha</th><th>Proveedor</th><th>Factura</th><th class="num">Renglones</th><th class="num">Total</th></tr></thead><tbody id="list"></tbody></table></div>
    </section>

    <dialog id="receive-dialog" aria-labelledby="receive-title" style="width:min(980px,calc(100vw - 32px))">
      <form method="dialog">
        <header><h2 id="receive-title">Recibir mercancía</h2><button class="btn ghost icon-btn" value="cancel" formnovalidate aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></header>
        <div class="body">
          <div class="form-grid">
            <label class="field"><span>Proveedor</span><select id="r-supplier"><option value="">Sin proveedor</option></select></label>
            <label class="field"><span>Factura o remisión</span><input id="r-invoice" maxlength="50" class="mono"></label>
            <label class="field"><span>Notas</span><input id="r-notes" maxlength="500"></label>
          </div>
          <section class="r-order" id="r-order" hidden>
            <div><b id="r-order-title"></b><br><span class="muted" style="font-size:.88rem">Cuenta lo que viene en la caja y captúralo en <b>Llegó</b>. Lo que no llegó déjalo en 0.</span></div>
            <div class="r-order-actions">
              <button class="btn sm" type="button" id="r-all"><i class="bi bi-check2-all"></i>Llegó todo completo</button>
              <button class="btn sm ghost" type="button" id="r-none">Poner todo en 0</button>
            </div>
            <div class="r-order-status" id="r-order-status" role="status"></div>
            <label id="r-close-wrap" hidden style="display:inline-flex;gap:6px;align-items:center;font-size:.88rem"><input type="checkbox" id="r-close">
              Cerrar el pedido con lo que llegó (ya no esperar lo que falta)</label>
          </section>
          <div style="display:grid;gap:10px" id="r-lines"></div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <button class="btn sm" type="button" id="r-add"><i class="bi bi-plus"></i>Agregar renglón</button>
            <span>Total <b class="num" id="r-total" style="font-size:1.2rem">$0.00</b></span>
          </div>
          <div class="form-error" hidden></div>
        </div>
        <footer><button class="btn ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="save">Registrar recepción</button></footer>
      </form>
    </dialog>

    <dialog id="detail-dialog" aria-labelledby="detail-title" style="width:min(820px,calc(100vw - 32px))">
      <form method="dialog">
        <header><h2 id="detail-title">Recepción</h2><button class="btn ghost icon-btn" value="cancel" aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></header>
        <div class="body" id="detail-body"></div>
        <footer><button class="btn" type="button" id="detail-labels"><i class="bi bi-qr-code"></i>Imprimir etiquetas</button><button class="btn" value="cancel">Cerrar</button></footer>
      </form>
    </dialog>
  </main>
  <script src="js/core.js"></script>
  <script src="js/picker.js"></script>
  <script src="vendor/qrcode/qrcode.js"></script>
  <script src="js/labels.js"></script>
  <script>
    POS.boot({ module: 'Purchases', title: 'Recepciones' }, async () => {
      const { api, session, fmt, esc, toast, $, $$ } = POS;
      if (!session.can('Purchases', true)) $('#new-btn').hidden = true;
      const suppliers = session.can('Suppliers') ? await api.get('/suppliers') : [];
      const opts = suppliers.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
      $('#f-supplier').insertAdjacentHTML('beforeend', opts);
      $('#r-supplier').insertAdjacentHTML('beforeend', opts);

      async function load() {
        const qs = new URLSearchParams({ pageSize: 100 });
        if ($('#from').value) qs.set('from', $('#from').value);
        if ($('#to').value) qs.set('to', $('#to').value);
        if ($('#f-supplier').value) qs.set('supplierId', $('#f-supplier').value);
        const r = await api.get('/purchases?' + qs);
        $('#list').innerHTML = r.data.length ? r.data.map(p => `
          <tr class="clickable" data-id="${p.id}"><td class="mono">${esc(p.folio)}</td><td>${fmt.dateTime(p.createdAt)}</td>
          <td>${esc(p.supplierName || '—')}</td><td class="mono">${esc(p.invoiceNumber || '')}</td>
          <td class="num">${p.itemCount}</td><td class="num">${fmt.money(p.total)}</td></tr>`).join('')
          : '<tr><td colspan="6" class="empty">No hay recepciones en el periodo. Registra la primera con «Recibir mercancía».</td></tr>';
      }
      ['#from', '#to', '#f-supplier'].forEach(id => $(id).addEventListener('change', load));

      $('#list').addEventListener('click', async e => {
        const row = e.target.closest('[data-id]');
        if (!row) return;
        const p = shown = await api.get('/purchases/' + row.dataset.id);
        $('#detail-title').innerHTML = `Recepción <span class="mono">${esc(p.folio)}</span>`;
        $('#detail-body').innerHTML = `
          <div class="muted">${fmt.dateTime(p.createdAt)} · ${esc(p.supplierName || 'Sin proveedor')}${p.invoiceNumber ? ' · Factura <span class="mono">' + esc(p.invoiceNumber) + '</span>' : ''}</div>
          <div class="table-wrap"><table><thead><tr><th>Presentación</th><th>Lote</th><th>Caducidad</th><th class="num">Cant.</th><th class="num">Costo</th><th class="num">Importe</th></tr></thead><tbody>
          ${p.items.map(i => `<tr><td>${esc(i.description)}</td><td class="mono">${esc(i.lotNumber || '')}</td><td>${fmt.day(i.expirationDate)}</td>
            <td class="num">${fmt.qty(i.quantity)}</td><td class="num">${fmt.money(i.unitCost)}</td><td class="num">${fmt.money(i.subtotal)}</td></tr>`).join('')}
          </tbody></table></div>
          <div style="text-align:right">Total <b class="num">${fmt.money(p.total)}</b></div>
          ${p.notes ? `<p class="muted" style="margin:0">${esc(p.notes)}</p>` : ''}`;
        $('#detail-dialog').showModal();
      });
      let shown = null;
      // One label per piece received, on the lot it came in.
      const printLabels = async p => {
        try { POS.labels.open(await api.get(`/labels/purchase/${p.id}`), { title: `Recepción ${p.folio}` }); } catch (err) { POS.fail(err); }
      };
      $('#detail-labels').addEventListener('click', () => shown && printLabels(shown));

      // ── Receive form ──
      const dlg = $('#receive-dialog');
      function addLine(item) {
        const row = document.createElement('div');
        row.className = 'rline';
        row.innerHTML = `
          <label class="field"><span>Presentación</span><input class="r-variant" required placeholder="Busca por nombre, tono o SKU"></label>
          <label class="field"><span>Cantidad</span><input class="r-qty" type="number" min="0.001" step="any" required></label>
          <label class="field"><span>Costo unit.</span><input class="r-cost mono" type="number" min="0" step="0.01" required></label>
          <label class="field"><span>Lote</span><input class="r-lot mono" maxlength="50"></label>
          <label class="field"><span>Caducidad</span><input class="r-exp" type="date"></label>
          <button class="btn ghost sm" type="button" aria-label="Quitar renglón"><i class="bi bi-x"></i></button>`;
        row.querySelector('button').onclick = () => { if ($$('.rline', dlg).length > 1) { row.remove(); total(); } };
        variantPicker(row.querySelector('.r-variant'), v => {
          row.variant = v;
          row.querySelector('.r-cost').value = v.cost || '';
          total();
          row.querySelector('.r-lot').required = v.tracksBatches;
          row.querySelector('.r-lot').placeholder = v.tracksBatches ? 'Requerido' : 'Opcional';
          row.querySelector('.r-qty').focus();
        });
        row.addEventListener('input', () => { total(); compare(); });
        $('#r-lines').appendChild(row);
        // A line coming from a supplier order arrives with its product, the pieces still expected and their cost.
        if (item) {
          row.variant = { id: item.variantId, cost: item.unitCost, tracksBatches: item.tracksBatches, displayName: item.description };
          row.ordered = item.pending;
          row.querySelector('.r-variant').value = item.description;
          const qty = row.querySelector('.r-qty');
          qty.value = item.pending;
          qty.min = '0';
          qty.closest('label').querySelector('span').textContent = 'Llegó';
          qty.insertAdjacentHTML('afterend', '<small class="r-vs"></small>');
          row.querySelector('.r-cost').value = item.unitCost;
          row.querySelector('.r-lot').required = item.tracksBatches;
          row.querySelector('.r-lot').placeholder = item.tracksBatches ? 'Requerido' : 'Opcional';
        }
      }
      /** Received against ordered, per line and for the whole order. */
      function compare() {
        if (!fromOrder) return;
        const short = [], extra = [];
        let pieces = 0;
        for (const r of $$('.rline', dlg)) {
          const got = Number(r.querySelector('.r-qty').value) || 0;
          const name = r.variant?.displayName || r.querySelector('.r-variant').value || 'Producto';
          pieces += got;
          if (r.ordered == null) { if (got > 0) extra.push(`${fmt.qty(got)} × ${name} (no venía en el pedido)`); continue; }
          const tag = r.querySelector('.r-vs');
          const diff = got - r.ordered;
          tag.className = 'r-vs ' + (diff === 0 ? 'ok' : diff < 0 ? 'short' : 'extra');
          tag.textContent = diff === 0 ? `✓ de ${fmt.qty(r.ordered)}` : diff < 0 ? `Faltan ${fmt.qty(-diff)} de ${fmt.qty(r.ordered)}` : `${fmt.qty(diff)} de más`;
          if (diff < 0) short.push(`${fmt.qty(-diff)} × ${name}`);
          if (diff > 0) extra.push(`${fmt.qty(diff)} × ${name} de más`);
        }
        const status = $('#r-order-status');
        $('#r-close-wrap').hidden = !short.length;
        if (!short.length) {
          status.className = 'r-order-status ok';
          status.textContent = `✓ Llegó completo: ${fmt.qty(pieces)} piezas.` + (extra.length ? ` Además: ${extra.join('; ')}.` : '');
        } else {
          status.className = 'r-order-status short';
          status.textContent = `Llegó incompleto. Falta: ${short.join('; ')}. `
            + ($('#r-close').checked ? 'El pedido se cerrará con ese faltante.' : 'El pedido quedará como "Recibido parcial" para recibir el resto después.')
            + (extra.length ? ` Además: ${extra.join('; ')}.` : '');
        }
      }
      $('#r-close').addEventListener('change', compare);
      $('#r-all').addEventListener('click', () => { $$('.rline', dlg).forEach(r => { if (r.ordered != null) r.querySelector('.r-qty').value = r.ordered; }); total(); compare(); });
      $('#r-none').addEventListener('click', () => { $$('.rline', dlg).forEach(r => { if (r.ordered != null) r.querySelector('.r-qty').value = 0; }); total(); compare(); });

      function total() {
        const t = $$('.rline', dlg).reduce((s, r) => s + (Number(r.querySelector('.r-qty').value) || 0) * (Number(r.querySelector('.r-cost').value) || 0), 0);
        $('#r-total').textContent = fmt.money(t);
      }
      $('#r-add').addEventListener('click', addLine);
      let fromOrder = null;
      $('#new-btn').addEventListener('click', () => {
        fromOrder = null;
        $('#r-order').hidden = true;
        dlg.querySelector('form').reset();
        dlg.querySelector('.form-error').hidden = true;
        $('#r-lines').innerHTML = '';
        addLine(); total();
        dlg.showModal();
      });

      dlg.querySelector('form').addEventListener('submit', async e => {
        e.preventDefault();
        if (e.submitter?.value === 'cancel') { dlg.close(); return; }
        const err = dlg.querySelector('.form-error');
        // An ordered product that did not arrive (0) is simply not part of the reception.
        const rows = $$('.rline', dlg).filter(r => !(r.ordered != null && !(Number(r.querySelector('.r-qty').value) > 0)));
        if (!rows.length) { err.textContent = 'No capturaste nada recibido. Si no llegó nada, cierra esta ventana.'; err.hidden = false; return; }
        if (rows.some(r => !r.variant)) { err.textContent = 'Elige cada presentación de la lista de resultados.'; err.hidden = false; return; }
        try {
          const p = await api.post('/purchases', {
            supplierId: $('#r-supplier').value ? Number($('#r-supplier').value) : null,
            invoiceNumber: $('#r-invoice').value.trim() || null,
            notes: $('#r-notes').value.trim() || null,
            items: rows.map(r => ({
              variantId: r.variant.id,
              quantity: Number(r.querySelector('.r-qty').value),
              unitCost: Number(r.querySelector('.r-cost').value),
              lotNumber: r.querySelector('.r-lot').value.trim() || null,
              expirationDate: r.querySelector('.r-exp').value || null,
            })),
          });
          toast(`Recepción ${p.folio} registrada. Imprime sus etiquetas.`);
          if (fromOrder) {
            const o = await api.post(`/orders/${fromOrder.id}/received`, { purchaseId: p.id, closeIncomplete: $('#r-close').checked }).catch(POS.fail);
            if (o) toast(o.status === 'Recibido parcial'
              ? `Pedido ${o.folio}: recibido en parte. Lo que falta queda pendiente.`
              : `Pedido ${o.folio}: recibido.`);
            fromOrder = null;
            history.replaceState(null, '', location.pathname);
          }
          dlg.close();
          await load();
          await printLabels(p);
        } catch (ex) { err.textContent = ex.message; err.hidden = false; }
      });

      await load();

      // purchases.html#order=12 opens the reception filled with that supplier order (from Pedidos → Recibir mercancía).
      const orderId = Number((location.hash.match(/order=(\d+)/) || [])[1]);
      if (orderId) {
        try {
          fromOrder = await api.get('/orders/' + orderId);
          dlg.querySelector('form').reset();
          dlg.querySelector('.form-error').hidden = true;
          $('#r-lines').innerHTML = '';
          $('#r-supplier').value = fromOrder.supplierId ?? '';
          $('#r-notes').value = `Pedido ${fromOrder.folio}`;
          const pending = fromOrder.items.filter(i => i.pending > 0);
          pending.forEach(i => addLine(i));
          const partial = fromOrder.status === 'Recibido parcial';
          $('#r-order-title').textContent = `Pedido ${fromOrder.folio}${partial ? ' · lo que faltaba por llegar' : ''}: ${pending.length} producto(s), ${fmt.qty(pending.reduce((t, i) => t + i.pending, 0))} piezas`;
          $('#r-order').hidden = false;
          $('#r-close').checked = false;
          total(); compare();
          dlg.showModal();
        } catch (err) { POS.fail(err); }
      }
    });
  </script>
</body>
</html>
